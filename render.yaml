services:
  - type: web
    name: hyperdesk-scout
    runtime: docker
    plan: free
    repo: https://github.com/CasmanKaido/hyperdesk-scout
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HYPERLIQUID_API_URL
        value: https://api.hyperliquid.xyz
      - key: HYPERLIQUID_TIMEOUT_MS
        value: "5000"
      - key: MARKET_DATA_CACHE_TTL_MS
        value: "10000"
      - key: MARKET_DATA_MAX_AGE_MS
        value: "30000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "60"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: CORS_ALLOW_ORIGIN
        value: "*"
      - key: PUBLIC_BASE_URL
        value: https://hyperdesk-scout.onrender.com
      # x402 paid research report (OKX Agent Payments Protocol). Disabled until
      # the secrets below are set in the Render dashboard, never in this file:
      # X402_ENABLED=true, X402_PAYTO_ADDRESS, X402_ASSET_ADDRESS (USD₮0 on the
      # chosen network), X402_FACILITATOR_URL, OKX_API_KEY, OKX_SECRET_KEY, and
      # OKX_API_PASSPHRASE. Defaults: X Layer testnet
      # eip155:1952, 0.01 USD₮0 per report (X402_PRICE_RESEARCH_REPORT_ATOMIC=10000).
      - key: X402_ENABLED
        value: "false"
      - key: X402_NETWORK
        value: eip155:1952
      - key: X402_PRICE_RESEARCH_REPORT_ATOMIC
        value: "10000"
